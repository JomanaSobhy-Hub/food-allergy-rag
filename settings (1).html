<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustBite — الإعدادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<style>
  .settings-shell {
    background: var(--dk-bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .settings-card {
    width: 100%;
    max-width: 480px;
    background: var(--dk-surface);
    border: 1px solid var(--dk-border-soft);
    border-radius: 24px;
    padding: 24px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--dk-border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dk-surface-2);
    color: var(--dk-text);
    flex: none;
  }
  .settings-icon.primary {
    background: rgba(99,102,241,.12);
    color: var(--primary);
  }
  .settings-section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--dk-text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 20px 0 8px 4px;
  }
  .settings-chevron {
    color: var(--dk-text-faint);
    flex: none;
  }
  .avatar-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-weight: 800;
    font-size: 24px;
    position: relative;
  }
  .avatar-edit {
    position: absolute;
    bottom: -2px;
    left: -2px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--dk-surface-2);
    border: 2px solid var(--dk-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .close-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dk-surface-2);
    border: none;
    color: var(--dk-text);
    cursor: pointer;
    transition: all .15s ease;
  }
  .close-btn:hover { background: var(--dk-surface-3); }
  .logout-btn {
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    padding: 14px;
    border-radius: 12px;
    background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.15);
    color: var(--alert);
    cursor: pointer;
    transition: all .15s ease;
    font-family: 'Cairo', 'Inter', sans-serif;
  }
  .logout-btn:hover { background: rgba(239,68,68,.15); }
</style>
</head>
<body class="min-h-screen">

<div class="settings-shell">
  <div class="settings-card">

    <!-- top bar -->
    <div class="flex items-center justify-between mb-8">
      <a href="dashboard.html" class="close-btn" aria-label="close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
      <p class="font-display font-bold text-sm" style="color:var(--dk-text)" data-ar="الإعدادات" data-en="Settings">الإعدادات</p>
      <div class="lang-toggle">
        <button data-lang="ar" onclick="setLang('ar')">العربية</button>
        <button data-lang="en" onclick="setLang('en')">English</button>
      </div>
    </div>

    <!-- profile -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="avatar-ring mb-3">
        ر
        <button class="avatar-edit" aria-label="edit avatar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m16.5 3.5 4 4L8 20H4v-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="font-display font-bold text-lg" style="color:var(--dk-text)">ريم عادل</p>
    </div>

    <!-- Customize TrustBite -->
    <p class="settings-section-label" data-ar="تخصيص TrustBite" data-en="Customize TrustBite">تخصيص TrustBite</p>
    <div class="mb-5" style="background:var(--dk-surface-2); border-radius:16px; overflow:hidden; border:1px solid var(--dk-border);">
      <a href="#" class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9 10h.01M15 10h.01M8.5 14.5c1 1 5 1 6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="تفضيلات الإجابات" data-en="Answer preferences">تفضيلات الإجابات</span>
        <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="#" class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-9.5-9C.7 8.1 2.6 4 6.5 4c2 0 3.4 1 5.5 3.2C14.1 5 15.5 4 17.5 4 21.4 4 23.3 8.1 21.5 12 19 16.6 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="الحساسيات الغذائية" data-en="Food allergies">الحساسيات الغذائية</span>
        <span class="text-xs font-bold" style="color:var(--dk-text-faint)" data-ar="اختياري" data-en="Optional">اختياري</span>
        <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="#" class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 12h8M8 16h8M8 8h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="المصادر الموثوقة" data-en="Trusted sources">المصادر الموثوقة</span>
        <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <!-- Account -->
    <p class="settings-section-label" data-ar="الحساب" data-en="Account">الحساب</p>
    <div class="mb-5" style="background:var(--dk-surface-2); border-radius:16px; overflow:hidden; border:1px solid var(--dk-border);">
      <div class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m3 7 9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="flex-1">
          <p class="text-sm font-bold" style="color:var(--dk-text)" data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</p>
          <p class="text-xs mt-0.5" style="color:var(--dk-text-faint); direction:ltr; text-align:right">reem@email.com</p>
        </div>
      </div>
      <div class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5c0 8.3 6.7 15 15 15l3-4-6-3-2 2c-2-1-4-3-5-5l2-2-3-6-4 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </span>
        <div class="flex-1">
          <p class="text-sm font-bold" style="color:var(--dk-text)" data-ar="رقم الموبايل" data-en="Phone number">رقم الموبايل</p>
          <p class="text-xs mt-0.5" style="color:var(--dk-text-faint); direction:ltr; text-align:right">+201100169164</p>
        </div>
      </div>
      <div class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="الاشتراك" data-en="Subscription">الاشتراك</span>
        <span class="text-xs font-bold" style="color:var(--dk-text-faint)" data-ar="مجاني" data-en="Free">مجاني</span>
      </div>
      <a href="#" class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--primary)" data-ar="ترقية الخطة" data-en="Upgrade plan">ترقية الخطة</span>
      </a>
    </div>

    <!-- Language -->
    <p class="settings-section-label" data-ar="اللغة" data-en="Language">اللغة</p>
    <div class="mb-5" style="background:var(--dk-surface-2); border-radius:16px; overflow:hidden; border:1px solid var(--dk-border);">
      <div class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="لغة التطبيق" data-en="App language">لغة التطبيق</span>
        <div class="lang-toggle">
          <button data-lang="ar" onclick="setLang('ar')">العربية</button>
          <button data-lang="en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>

    <!-- Theme -->
    <p class="settings-section-label" data-ar="المظهر" data-en="Theme">المظهر</p>
    <div class="mb-4" style="background:var(--dk-surface-2); border-radius:16px; overflow:hidden; border:1px solid var(--dk-border);">
      <div class="settings-row" style="padding:14px 16px;">
        <span class="settings-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 9 9c0-.3 0-.7-.1-1a5.5 5.5 0 0 1-7.9-7A9 9 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="flex-1 text-sm font-bold" style="color:var(--dk-text)" data-ar="داكن" data-en="Dark">داكن</span>
        <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <button class="logout-btn" data-ar="تسجيل الخروج" data-en="Log out">تسجيل الخروج</button>
  </div>
</div>

<script src="lang.js"></script>
</body>
</html>
